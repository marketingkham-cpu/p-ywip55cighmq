html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

[hidden]{display:none!important}</style>
<style>
/* Layout: consola de los 90 con ilustración lisa. HUD arriba con franja de patrón africano, escenario del mundo como pantalla principal, tarjetas gruesas tipo menú de juego, barra de control fija. Un solo look nocturno a propósito. */
:root{
  --night:#1b1442; --panel:#2a2163; --panel2:#3a2f80; --ink:#0d0a24;
  --cream:#fbf3dc; --muted:#c3bbe8;
  --coin:#ffcc33; --coin2:#c98a12; --red:#ff4d6d; --green:#3ddc84; --sky:#5ec8f8; --pink:#ff7aa8;
  --ochre:#e0a030; --terra:#c8553a; --kaolin:#f3e6c8;
  --f-disp:"Bungee", "Arial Black", Impact, sans-serif;
  --f-body:"Fredoka", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --zig:linear-gradient(135deg,var(--ochre) 25%,transparent 25%) -6px 0/12px 12px,linear-gradient(225deg,var(--ochre) 25%,transparent 25%) -6px 0/12px 12px,linear-gradient(315deg,var(--ink) 25%,transparent 25%) 0 0/12px 12px,linear-gradient(45deg,var(--ink) 25%,transparent 25%) 0 0/12px 12px,var(--terra);
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--cream)}
body{font-family:var(--f-body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(rgba(255,255,255,.05) 1.2px,transparent 1.2px);background-size:14px 14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
svg{display:block;overflow:visible}
.disp{font-family:var(--f-disp);letter-spacing:.02em;line-height:1.2}

.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));

.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

  const st=e.steps||0;if(st>=8000)p.push(['8,000+ pasos',20]);else if(st>=5000)p.push(['5,000+ pasos',10]);
  if(e.mood&&e.back)p.push(['Contaste cómo te sentiste',10]);

  for(const d of ds){const e=S.days[d];streak=(prev&&diff(prev,d)===1)?streak+1:1;prev=d;best=Math.max(best,streak);
    const p=dayParts(e,streak,d);per[d]=p;xp+=p.total;walk+=e.walkMin||0;steps+=e.steps||0;if(isTrain(e))ses++;if(e.mood&&e.back)feels++}
  const t=today();const cur=prev&&diff(prev,t)<=1?streak:0;
  const weeks={};for(const d of ds){const w=Math.floor(diff(S.start,d)/7);if(w<0)continue;weeks[w]=(weeks[w]||0)+dmg(S.days[d])}
  const curW=Math.max(0,Math.floor(diff(S.start,t)/7));
  const beat=Object.keys(weeks).filter(w=>weeks[w]>=100).map(Number);
  const games=Object.values(S.games||{}).filter(g=>g.ok).length;const items={};let blockCoins=0;Object.values(S.blocks).forEach(b=>{blockCoins+=b.n||0;if(b.item)items[b.item]=(items[b.item]||0)+1});
  const level=Math.floor(xp/XPL);

  st.ach=ACH.filter(a=>a.ok(st)).map(a=>a.id);
  st.spent=S.spent.reduce((a,b)=>a+b.cost,0);
  st.coins=xp+blockCoins+beat.length*100+st.ach.length*25+games*GAME_COINS-st.spent;
  return st}

  document.body.appendChild(ov);ov.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{const b=m.btns[+el.dataset.i];ov.remove();QUEUE.shift();if(b.fn)b.fn();showNext()});
  fillPix(ov);const f=ov.querySelector('[data-i]');f&&f.focus();m.onOpen&&m.onOpen(ov)}
const randPet=()=>PETS[Math.floor(Math.random()*PETS.length)];

  <div class="who">${mask(2,1,18)}${esc(S.name.toUpperCase())}</div>
  <div class="stat" title="Monedas">${coin(20)}<span>${num(st.coins)}</span></div>
  <div class="stat" title="Racha de días">${flame(20)}<span>${st.streak}</span></div>

const NAVI={map:'<path d="M3 11L12 3L21 11V21H14.5V15H9.5V21H3Z"/>',add:'<path d="M9.8 3h4.4v6.8H21v4.4h-6.8V21H9.8v-6.8H3V9.8h6.8z"/>',
 chest:'<path d="M3 10Q3 4 12 4Q21 4 21 10V20.5H3Z"/><rect x="10" y="9" width="4" height="5" rx="1" fill="#0d0a24"/>',
 log:'<path d="M5 2.5H15.5L19.5 6.5V21.5H5Z"/><path d="M8 10H16.5M8 13.5H16.5M8 17H13.5" stroke="#0d0a24" stroke-width="1.8" stroke-linecap="round"/>'};
const navIc=(k,w)=>`<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="currentColor" aria-hidden="true">${NAVI[k]}</svg>`;
function nav(){const it=[['map','MAPA'],['add','REGISTRAR'],['chest','COFRE'],['log','DIARIO']];

  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{SFX.tap();go(b.dataset.v)})}
function go(v,opt){VIEW=v;if(v==='add'){FDATE=(opt&&opt.date)||today();FORM=JSON.parse(JSON.stringify(S.days[FDATE]||{}))}render();window.scrollTo(0,0)}
function render(){const st=calc();if(st.level<S.seenLevel){S.seenLevel=st.level;save()}const a=$('#app');
  a.innerHTML=hud(st)+(VIEW==='map'?mapView(st):VIEW==='add'?addView(st):VIEW==='chest'?chestView(st):logView(st));
  fillPix(a);nav();$('#gear').onclick=settings;
  ({map:bindMap,add:bindAdd,chest:bindChest,log:bindLog})[VIEW](st)}

/* ============ ESCENA ============ */
function cloud(x,y,s,o=1){return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}" fill="#fff"><circle cx="12" cy="12" r="9"/><circle cx="24" cy="8" r="11"/><circle cx="36" cy="13" r="8"/><rect x="8" y="12" width="32" height="9" rx="4.5"/></g>`}
function deco(kind,x,y,W){
  if(kind==='pine')return `<g transform="translate(${x} ${y})"><g class="sway"><rect x="-1.6" y="-6" width="3.2" height="7" fill="#6b3f1e"/><path d="M0 -30L9 -14H5L12 -4H-12L-5 -14H-9Z" fill="${W.hill}" stroke="${K}" stroke-width=".8" stroke-linejoin="round"/></g></g>`;
  if(kind==='cactus')return `<g transform="translate(${x} ${y})"><path d="M-3.5 0V-24A3.5 3.5 0 0 1 3.5 -24V0Z M3.5 -12H7V-18A2.5 2.5 0 0 1 12 -18V-10Q12 -7 9 -7H3.5Z M-3.5 -9H-7Q-10 -9 -10 -12V-16A2.5 2.5 0 0 1 -5 -16V-13H-3.5Z" fill="#3c9a5a" stroke="${K}" stroke-width=".8" stroke-linejoin="round"/></g>`;
  if(kind==='starfish')return `<g transform="translate(${x-7} ${y-12}) scale(.6)">${itemInner('star','#ff9f1c','#c76a00')}</g>`;
  if(kind==='flower')return `<g transform="translate(${x-6} ${y-14}) scale(.55)"><g class="sway">${itemInner('flower','#ff7aa8','#c83c6e')}</g></g>`;
  if(kind==='gem')return `<g transform="translate(${x-7} ${y-14}) scale(.6)">${itemInner('gem','#5ec8f8','#2a7fb8')}</g>`;
  if(kind==='bell')return `<g transform="translate(${x-6} ${y-13}) scale(.55)">${itemInner('bell','#ffcc33','#c98a12')}</g>`;
  return `<g transform="translate(${x-6} ${y-13}) scale(.55)" class="twinkle">${itemInner('star','#ffcc33','#c98a12')}</g>`}
function totem(x,y,v,p,s=.5){return `<g transform="translate(${x} ${y})"><rect x="-1.6" y="-16" width="3.2" height="16" rx="1" fill="#6b3f1e" stroke="${K}" stroke-width=".6"/><g transform="translate(${-20*s} ${-16-56*s}) scale(${s})">${maskInner(v,MPAL[p])}</g></g>`}
function scene(wi,node){const W=WORLDS[wi];let s='';
  s+=`<rect width="320" height="200" fill="${W.sky}"/>`;
  if(W.night){for(let i=0;i<28;i++){const x=(i*73)%317,y=(i*37)%74+4;s+=`<circle class="${i%3?'':'twinkle'}" cx="${x}" cy="${y}" r="${i%4?0.9:1.4}" fill="#fff"/>`}
    s+=`<circle cx="268" cy="34" r="15" fill="#fff4cf"/><circle cx="262" cy="30" r="3" fill="#e9dcae"/><circle cx="272" cy="40" r="2" fill="#e9dcae"/>`}
  else{s+=`<circle cx="270" cy="34" r="16" fill="#fff1a8" opacity=".9"/><circle cx="270" cy="34" r="23" fill="#fff1a8" opacity=".25"/><g class="cloud">${cloud(0,14,1)}</g><g class="cloud c2">${cloud(-70,40,.7,.85)}</g>`}
  s+=`<path d="M0 118Q40 62 92 104Q132 58 192 98Q242 50 320 92V200H0Z" fill="${W.hill}"/>`;
  s+=`<path d="M0 124Q60 96 120 118Q180 92 240 116Q280 102 320 112V200H0Z" fill="${W.hill2}"/>`;
  // patrón de tela africana en las colinas lejanas
  s+=[30,150,250].map(x=>`<path d="M${x} 112l6-7 6 7 6-7 6 7" stroke="${W.g2}" stroke-width="1.6" fill="none" opacity=".55"/>`).join('');
  s+=`<path d="M0 132Q80 116 160 128T320 122V200H0Z" fill="${W.g}"/><path d="M0 132Q80 116 160 128T320 122" stroke="${W.g2}" stroke-width="4" fill="none"/>`;
  for(let i=0;i<26;i++)s+=`<ellipse cx="${(i*47)%316}" cy="${140+(i*29)%56}" rx="2.4" ry="1.2" fill="${W.g2}" opacity=".7"/>`;
  [[150,140],[14,150],[100,196],[240,198],[40,198]].forEach(([x,y])=>s+=deco(W.deco,x,y,W));
  s+=totem(170,132,wi%3,wi%MPAL.length);
  // Hanna en su maceta, cuidando el inicio del mapa
  s+=`<g transform="translate(288 170)">${petG(PETS[1],0,0,.5,true)}</g>`;
  const pts=NODES.map(p=>p.join(' ')).join(' L');
  s+=`<path d="M${pts}" stroke="rgba(13,10,36,.35)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 8"/>`;
  if(node>0)s+=`<path d="M${NODES.slice(0,node+1).map(p=>p.join(' ')).join(' L')}" stroke="#fbf3dc" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 8"/>`;
  const[cx,cy]=NODES[LPW-1];
  s+=`<g transform="translate(${cx-18} ${cy-40})"><rect x="0" y="12" width="9" height="28" rx="2" fill="#9a9cc4" stroke="${K}"/><rect x="27" y="12" width="9" height="28" rx="2" fill="#9a9cc4" stroke="${K}"/>
   <rect x="5" y="18" width="26" height="22" fill="#b4b6da" stroke="${K}"/><path d="M-1 12L4.5 2L10 12ZM26 12L31.5 2L37 12Z" fill="${node>=LPW-1?'#ffcc33':'#ff4d6d'}" stroke="${K}" stroke-linejoin="round"/>
   <path d="M13 40V32A5 5 0 0 1 23 32V40Z" fill="#1b1442"/><g transform="translate(14.5 19) scale(.18)">${maskInner(1,MPAL[1])}</g>
   <rect x="17.4" y="-8" width="1.4" height="14" fill="#fff"/><path d="M18.8 -8Q24 -6 28 -8V-2Q24 0 18.8 -2Z" fill="#ffcc33" stroke="${K}" stroke-width=".6"/></g>`;
  NODES.forEach(([x,y],i)=>{if(i===LPW-1)return;
    if(i<node)s+=`<ellipse cx="${x}" cy="${y+1}" rx="7" ry="3" fill="rgba(13,10,36,.3)"/><rect x="${x-.8}" y="${y-17}" width="1.6" height="17" fill="#fff"/><path d="M${x+.8} ${y-17}Q${x+6} ${y-15} ${x+10} ${y-17}V${y-11}Q${x+6} ${y-9} ${x+.8} ${y-11}Z" fill="#ffcc33" stroke="${K}" stroke-width=".6"/>`;
    else s+=`<ellipse cx="${x}" cy="${y+1}" rx="8" ry="4.4" fill="#0d0a24"/><ellipse cx="${x}" cy="${y}" rx="7" ry="3.6" fill="${i===node?'#ffcc33':'#6a62a8'}"/>`});
  const[hx,hy]=NODES[node];const D=.75; // densidad: 240 pixeles para 320 de ancho
  const spr=(vw,vh,inner,x,y,w,cls='',flip=false)=>`<div class="spr ${cls}" style="left:${U(x)};top:${U(y)};width:${U(w)}${flip?';transform:scaleX(-1)':''}">${pixImg(vw,vh,inner,w,Math.round(w*D),'sp')}</div>`;
  const pet=(p,x,y,sc)=>{const P=petInner(p);return spr(P.vw,P.vh,P.g,x,y,P.vw*sc,'',true)};
  // Paola + su equipo: Abuelita Calabaza y los 2 gatitos (Hanna se queda en su maceta)
  const hero=`<div id="hero" style="left:${U(hx-15)};top:${U(hy-45)}">${pet(PETS[0],-30,24,.52)}
    <div class="bob">${spr(40,60,heroArt(1),0,0,30,'f1')}${spr(40,60,heroArt(2),0,0,30,'f2')}</div>
    ${pet(PETS[2],27,28,.45)}${pet(PETS[3],42,33,.41)}</div>`;
  return `<div class="stage" role="img" aria-label="Mapa del mundo ${wi+1}, ${W.name}">${pixImg(320,200,s,320,240,'bg')}${hero}</div>`}
const U=n=>`calc(${n} * 100cqw / 320)`;

/* ============ MAPA ============ */
function mapView(st){const pending=st.level>S.seenLevel;const shown=pending?posOf(S.seenLevel):posOf(st.level);
  const W=WORLDS[shown.w];const inLvl=st.xp%XPL;const done=st.level>=NW*LPW;
  const t=today();const blk=S.blocks[t];const m=mission(t);const e=S.days[t]||{};const mdone=hasAny(e)&&m.ok(e);
  const B=BOSSES[st.curW%BOSSES.length];const hp=Math.max(0,100-(st.weeks[st.curW]||0));const left=7-(Math.max(0,diff(S.start,t))%7);
  const tp=PETS[hashS(t+'p')%PETS.length];const lines=petLines(tp);const line=lines[hashS(t)%lines.length];
  return `<div class="screen">${scene(shown.w,shown.n)}</div>
  <div class="worldbar"><span class="w">MUNDO ${shown.w+1} · ${W.name.toUpperCase()}</span><span class="l">${done?'¡JUEGO COMPLETADO!':`NIVEL ${shown.w+1}-${shown.n+1}`}</span></div>
  <div class="bar gold" aria-label="Experiencia del nivel"><i style="width:${done?100:inLvl/XPL*100}%"></i></div>
  <div class="barlbl"><span>${done?'+'+num(st.xp-NW*LPW*XPL)+' XP EXTRA':inLvl+' / '+XPL+' XP'}</span><span>${done?'':'FALTAN '+(XPL-inLvl)+' XP'}</span></div>
  <div class="stack" style="margin-top:20px">
   <button class="btn" id="go-add">${navIc('add',16)} REGISTRAR MI DÍA</button>
   <div class="box"><h3>TU EQUIPO</h3>
    <div class="bubble" id="bubble"><b>${esc(petName(tp))}:</b> ${line}</div>
    <div class="team">${PETS.map(p=>`<button class="pet" data-pet="${p.id}" style="background:none;border:0;padding:0" aria-label="${esc(petName(p))}">${petArt(p,78)}<span>${esc(petName(p))}</span></button>`).join('')}</div></div>
   <div class="box"><div class="duo">
     <button class="qblock ${blk?'used':''}" id="qb" aria-label="${blk?'Bloque sorpresa ya abierto':'Abrir bloque sorpresa'}">?</button>
     <div><h3>${blk?'BLOQUE DE HOY ABIERTO':'BLOQUE SORPRESA'}</h3><div class="small">${blk?blockText(blk)+' <span class="muted">Mañana hay otro.</span>':'Uno nuevo cada día. Tócalo y ve qué te tocó: monedas, un objeto para tu álbum o un power-up.'}</div></div>
   </div></div>
   ${gameCardHTML()}
   <div class="box"><h3>MISIÓN DEL DÍA · +15 XP</h3><div class="row" style="justify-content:space-between"><span>${m.t}</span><span class="tag" style="background:${mdone?'#25a85c':'var(--ink)'}">${mdone?'¡LISTA!':'PENDIENTE'}</span></div></div>
   <div class="box"><h3>JEFE DE LA SEMANA ${st.curW+1}</h3>
    <div class="boss ${hp<=0?'dead':''}"><div>${bossArt(B,88)}</div>
     <div style="min-width:0"><div class="name">${B.name.toUpperCase()}</div><div class="taunt">${hp<=0?'"¡Nooo! Me ganaste..."':B.taunt}</div>
      <div class="bar hp" aria-label="Vida del jefe"><i style="width:${hp}%"></i></div>
      <div class="barlbl"><span>VIDA ${hp}/100</span><span>${hp<=0?'DERROTADO · +100':left+' DÍAS'}</span></div></div></div>
    <div class="chips" style="margin-top:12px"><span class="tag">ENTRENAR = 40 DAÑO</span><span class="tag">1 MIN CAMINANDO = 1</span><span class="tag">CÓMO ME SENTÍ = 5</span></div>
   </div>
   <a class="link" href="${RUTINA_URL}" target="_blank" rel="noopener">ABRIR MI RUTINA ESPALDA EN CALMA ↗</a>
  </div>`}
function blockText(b){return b.k==='coins'?`Te tocaron <b>${b.n} monedas</b>.`:b.k==='item'?`Te tocó: <b>${esc((ITEMS.find(i=>i.id===b.item)||{}).name)}</b> (+5).`:`Power-up: ${esc(b.tip)} (+${b.n})`}
function bindMap(st){$('#go-add').onclick=()=>{SFX.tap();go('add')};
  $('#qb').onclick=()=>openBlock();
  $('#play').onclick=openGame;
  document.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{const p=PETS.find(x=>x.id===b.dataset.pet);p.type==='dog'?SFX.woof():SFX.meow();
    const L=petLines(p);$('#bubble').innerHTML=`<b>${esc(petName(p))}:</b> ${L[Math.floor(Math.random()*L.length)]}`});
  if(st.level>S.seenLevel&&!ANIM)walkTo(st)}
function openBlock(){const t=today();const q=$('#qb');if(S.blocks[t]){q.classList.remove('bump');void q.offsetWidth;q.classList.add('bump');SFX.tap();toast('Ya abriste el de hoy. Vuelve mañana.');return}
  const r=Math.random();let b;if(r<.45)b={k:'coins',n:5+Math.floor(Math.random()*16)};else if(r<.8)b={k:'item',item:ITEMS[Math.floor(Math.random()*ITEMS.length)].id,n:5};else b={k:'tip',tip:TIPS[Math.floor(Math.random()*TIPS.length)],n:15};
  const had=b.k==='item'&&calc().items[b.item];
  S.blocks[t]=b;save();q.classList.add('bump');SFX.block();setTimeout(SFX.coin,250);
  const art=b.k==='item'?itemSVG(b.item,76):b.k==='coins'?coin(70):sv(24,24,itemInner('star','#ffcc33','#c98a12'),70);
  setTimeout(()=>{modal(`<div class="center">${art}<h2>${b.k==='item'?(had?'¡REPETIDO!':'¡OBJETO NUEVO!'):b.k==='coins'?'¡+'+b.n+' MONEDAS!':'¡POWER-UP!'}</h2><div>${blockText(b)}</div>${b.k==='item'?'<div class="small muted">Ya está en tu álbum, en el Cofre.</div>':''}</div>`,[{t:'¡GENIAL!',c:'gold',fn:()=>{checkAch();render()}}]);confetti(24)},380)}
function walkTo(st){ANIM=true;const from=posOf(S.seenLevel),to=posOf(st.level);
  const hero=$('#hero');if(!hero){ANIM=false;return}
  const sameWorld=from.w===to.w;const target=sameWorld?to.n:LPW-1;let n=from.n;
  const step=()=>{if(n>=target){finish();return}n++;const[x,y]=NODES[n];const f1=hero.querySelector('.f1'),f2=hero.querySelector('.f2');
    f1.style.display='none';f2.style.display='block';SFX.jump();hero.style.left=U(x-15);hero.style.top=U(y-45);setTimeout(()=>{f1.style.display='';f2.style.display='none';step()},560)};
  const finish=()=>{const old=S.seenLevel;S.seenLevel=st.level;save();ANIM=false;SFX.level();confetti(50);
    if(!sameWorld){banner(`¡MUNDO ${from.w+1} SUPERADO!`,1700);setTimeout(()=>{modal(`<div class="center">${sv(40,56,heroArt(1),56)}<h2>¡BIENVENIDA AL MUNDO ${to.w+1}!</h2><div>${WORLDS[to.w].name}. Nuevo paisaje, nuevo reto. Tu equipo y tú llegaron hasta aquí por tu constancia.</div></div>`,[{t:'¡A JUGAR!',c:'gold',fn:render}])},1500)}
    else{banner(st.level-old>1?`¡+${st.level-old} NIVELES!`:'¡NIVEL SUPERADO!');setTimeout(render,1500)}};
  setTimeout(step,500)}

/* ============ REGISTRAR ============ */
const PAIN={1:'#3ddc84',2:'#a8e05f',3:'#ffcc33',4:'#ff9f1c',5:'#ff4d6d'};

  const opt=(k,v,l,sub)=>`<button class="opt" data-k="${k}" data-v="${v}" aria-pressed="${F[k]===v}">${l}${sub?`<small>${sub}</small>`:''}</button>`;
  const yday=addDays(today(),-1);

  <div class="box"><h3>¿QUÉ DÍA REGISTRAS?</h3><div class="chips">

    <div class="small muted" style="margin-top:8px">${fmt(FDATE)}${S.days[FDATE]?' · ya tenía registro, lo estás editando':''} · Misión de ese día: ${m.t.toLowerCase()}</div></div>
  <div class="box"><h3>1 · ¿ENTRENASTE?</h3><div class="opts">
    ${opt('train','A','Sesión A','+50 XP')}${opt('train','B','Sesión B','+50 XP')}${opt('train','camine','Caminé','+50 XP')}${opt('train','baile','Bailé','+50 XP')}${opt('train','descanso','Descanso','+15 XP')}</div>
    ${isTrain(F)?`<label class="f" for="f-tmin">MINUTOS (OPCIONAL)</label><input type="number" inputmode="numeric" id="f-tmin" min="0" max="300" value="${F.trainMin||''}" placeholder="45">`:''}
    <div class="small muted" style="margin-top:10px">Descansar también es parte del plan. Si hoy tocaba descanso, regístralo y gana.</div></div>
  <div class="box"><h3>2 · ¿CAMINASTE?</h3>
    <div class="walk"><button class="rnd" id="wminus" aria-label="Menos 5 minutos">-5</button><div class="big" aria-live="polite">${F.walkMin||0}<small>MINUTOS</small></div><button class="rnd" id="wplus" aria-label="Más 5 minutos">+5</button></div>
    <div class="chips" style="margin-top:14px;justify-content:center">${[10,15,20,30,45,60].map(v=>`<button class="opt" data-walk="${v}" aria-pressed="${F.walkMin===v}" style="padding:8px 14px">${v}</button>`).join('')}</div>
    <label class="f" for="f-steps">PASOS DEL CELULAR (OPCIONAL)</label><input type="number" inputmode="numeric" id="f-steps" min="0" value="${F.steps||''}" placeholder="6500"></div>
  <div class="box"><h3>3 · ¿CÓMO TE SENTISTE?</h3>
    <label class="f" style="margin-top:0">ÁNIMO</label><div class="faces">${[1,2,3,4,5].map(v=>`<button class="face" data-mood="${v}" aria-pressed="${F.mood===v}" aria-label="Ánimo ${v} de 5">${face(v,28)}${v}</button>`).join('')}</div>
    <label class="f">TU ESPALDA (1 = SIN MOLESTIA · 5 = DUELE MUCHO)</label><div class="faces">${[1,2,3,4,5].map(v=>`<button class="face" data-back="${v}" aria-pressed="${F.back===v}" aria-label="Molestia ${v} de 5"><span style="display:block;width:26px;height:26px;border-radius:50%;background:${PAIN[v]};border:2px solid #0d0a24"></span>${v}</button>`).join('')}</div>
    ${F.back>=4?`<div class="note">Escucha a tu espalda: hoy toca nivel suave o descanso. Igual ganas tus monedas por registrar. Si sigue así 2 o 3 días, avísale a tu coach.</div>`:''}
    <label class="f" for="f-note">NOTA (OPCIONAL)</label><textarea id="f-note" placeholder="¿Qué te funcionó hoy? ¿Algo que quieras recordar?">${esc(F.note||'')}</textarea></div>
  <div class="preview"><div class="xpnow"><span>GANAS AL GUARDAR</span><b>+${has?parts.total:0} XP</b></div>
   <button class="btn green" id="save" ${has?'':'disabled'}>${coin(18)} GUARDAR Y COBRAR</button></div>
  ${S.days[FDATE]?'<button class="btn ghost sm" id="del" style="align-self:center">BORRAR ESTE DÍA</button>':''}
  </div>`}
function predictStreak(){let k=1,d=addDays(FDATE,-1);while(S.days[d]&&hasAny(S.days[d])){k++;d=addDays(d,-1)}return k}
function refreshPreview(){const parts=dayParts(FORM,predictStreak(),FDATE);const has=hasAny(FORM);
  $('.xpnow b').textContent='+'+(has?parts.total:0)+' XP';$('#save').disabled=!has}
function bindAdd(){
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{SFX.tap();const k=b.dataset.k,v=b.dataset.v;FORM[k]=FORM[k]===v?undefined:v;keepScroll()});
  document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{SFX.tap();go('add',{date:b.dataset.date})});
  $('#f-date').onchange=e=>{const v=e.target.value;if(v&&v<=today())go('add',{date:v})};
  const setW=v=>{FORM.walkMin=Math.max(0,Math.min(300,v));SFX.tap();keepScroll()};
  $('#wminus').onclick=()=>setW((FORM.walkMin||0)-5);$('#wplus').onclick=()=>setW((FORM.walkMin||0)+5);
  document.querySelectorAll('[data-walk]').forEach(b=>b.onclick=()=>setW(+b.dataset.walk));
  document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{SFX.tap();FORM.mood=+b.dataset.mood;keepScroll()});
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{SFX.tap();FORM.back=+b.dataset.back;keepScroll()});
  const tmin=$('#f-tmin');tmin&&(tmin.oninput=e=>{FORM.trainMin=+e.target.value||undefined});
  $('#f-steps').oninput=e=>{FORM.steps=+e.target.value||undefined;refreshPreview()};
  $('#f-note').oninput=e=>{FORM.note=e.target.value;refreshPreview()};
  $('#save').onclick=saveDay;
  const del=$('#del');del&&(del.onclick=()=>{if(del.dataset.sure){delete S.days[FDATE];save();toast('Día borrado');go('log')}else{del.dataset.sure=1;del.textContent='¿SEGURA? TOCA OTRA VEZ'}})}
function keepScroll(){const y=window.scrollY;render();window.scrollTo(0,y)}
function saveDay(){const before=calc();const clean={};for(const[k,v]of Object.entries(FORM))if(v!==undefined&&v!==''&&v!==0)clean[k]=v;
  S.days[FDATE]=clean;save();const after=calc();const p=after.per[FDATE]||{parts:[],total:0};const gained=after.coins-before.coins;
  SFX.coin();confetti(30);const pp=randPet();
  const newBoss=after.beat.filter(w=>!before.beat.includes(w));
  modal(`<div class="center" style="margin-bottom:6px">${petArt(pp,96)}</div><h2>¡DÍA GUARDADO!</h2>${p.parts.map((x,i)=>`<div class="line" style="animation-delay:${i*.12}s"><span>${esc(x[0])}</span><b>+${x[1]}</b></div>`).join('')}
    <div class="total"><span>MONEDAS</span><span>${gained>=0?'+':''}${gained}</span></div>
    <div class="note"><b>${esc(petName(pp))}</b> ${pp.type==='dog'?'mueve la colita: ¡bien hecho!':'ronronea de orgullo.'}</div>
    ${clean.back>=4?'<div class="note">Hoy tu espalda pidió calma. Registrarlo también es cuidarte.</div>':''}`,[{t:'¡VER MI MAPA!',c:'gold'}],()=>{pp.type==='dog'?setTimeout(SFX.woof,500):setTimeout(SFX.meow,500)});
  newBoss.forEach(w=>{const B=BOSSES[w%BOSSES.length];modal(`<div class="center"><div style="transform:rotate(180deg);filter:grayscale(.6)">${bossArt(B,90)}</div><h2>¡DERROTASTE A ${B.name.toUpperCase()}!</h2><div>Jefe de la semana ${w+1} vencido. +100 monedas y un trofeo para tu cofre.</div></div>`,[{t:'¡TOMA ESO!',c:'gold'}],()=>{SFX.boss();confetti(60)})});
  checkAch();
  const last=QUEUE[QUEUE.length-1].btns;const lb=last[last.length-1];const fn=lb.fn;lb.fn=()=>{fn&&fn();VIEW='map';render();window.scrollTo(0,0)}}
function checkAch(){const st=calc();const nw=st.ach.filter(a=>!S.achSeen.includes(a));if(!nw.length)return;S.achSeen=st.ach;save();
  nw.forEach(id=>{const i=ACH.findIndex(x=>x.id===id);const a=ACH[i];modal(`<div class="center">${achMask(i,64)}<h2>¡NUEVA MÁSCARA GUARDIANA!</h2><div><b>${a.n}</b><br>${a.d}</div><div class="small muted">+25 monedas</div></div>`,[{t:'¡SÍ!',c:'gold'}],()=>{SFX.level()})})}

/* ============ COFRE ============ */
function chestView(st){const segs=[['premios','PREMIOS'],['album','ÁLBUM'],['medallas','MÁSCARAS']];
  let body='';
  if(CHEST==='premios'){body=`<div class="box"><h3>CANJEA TUS MONEDAS</h3><div class="small muted" style="margin-bottom:6px">Premios reales que tú eliges para consentirte. Junta monedas y date el gusto.</div>
    ${S.rewards.map(r=>`<div class="reward">${itemSVG(r.icon,36)}<div class="nm"><div>${esc(r.name)}</div><div class="price">${coin(14)} ${num(r.cost)}</div></div>
      <div class="row" style="gap:6px"><button class="btn sm ${st.coins>=r.cost?'gold':''}" data-buy="${r.id}" ${st.coins>=r.cost?'':'disabled'}>${st.coins>=r.cost?'CANJEAR':'FALTAN '+num(r.cost-st.coins)}</button>
      <button class="btn sm ghost" data-rm="${r.id}" aria-label="Quitar premio">X</button></div></div>`).join('')}</div>
   <div class="box"><h3>AGREGAR UN PREMIO</h3><label class="f" for="r-name" style="margin-top:0">¿QUÉ TE GUSTARÍA DARTE?</label><input type="text" id="r-name" maxlength="60" placeholder="Ej. Una tarde de cine">
     <div class="small muted" style="margin-top:10px">Ideas para tocar y llenar rápido:</div>
     <div class="chips" style="margin-top:8px">${IDEAS.filter(i=>!S.rewards.some(r=>r.name===i[0])).slice(0,8).map(i=>`<button class="opt" data-idea="${esc(i[0])}" data-cost="${i[1]}" style="padding:6px 10px;font-size:14px;font-weight:500">${esc(i[0])}</button>`).join('')}</div>
     <label class="f" for="r-cost">PRECIO EN MONEDAS</label><input type="number" inputmode="numeric" id="r-cost" min="10" placeholder="200">
     <div class="small muted" style="margin-top:8px">Referencia: un día completo da entre 80 y 150 monedas.</div>
     <button class="btn green" id="r-add" style="margin-top:12px">AGREGAR</button></div>
   ${S.spent.length?`<div class="box"><h3>YA CANJEADOS</h3>${S.spent.slice().reverse().map(x=>`<div class="line" style="animation:none"><span>${esc(x.name)} <span class="muted small">· ${fmt(x.date)}</span></span><b>-${x.cost}</b></div>`).join('')}</div>`:''}`}
  else if(CHEST==='album'){body=`<div class="box"><h3>ÁLBUM · ${st.uniq}/24</h3><div class="small muted" style="margin-bottom:12px">Salen del bloque sorpresa diario. ¿Podrás juntar los 24?</div>
    <div class="grid">${ITEMS.map(i=>{const c=st.items[i.id]||0;return `<div class="cell ${c?'':'off'}">${itemSVG(i.id,36)}<span>${c?esc(i.name):'???'}</span>${c>1?`<span class="cnt">x${c}</span>`:''}</div>`}).join('')}</div></div>
    <div class="box"><h3>TROFEOS DE JEFES · ${st.beat.length}/8</h3><div class="grid">${BOSSES.map((B,w)=>{const ok=st.beat.some(x=>x%8===w);return `<div class="cell ${ok?'':'off'}">${bossArt(B,40)}<span>${ok?esc(B.name):'Semana '+(w+1)}</span></div>`}).join('')}</div></div>`}
  else{body=`<div class="box"><h3>MÁSCARAS GUARDIANAS · ${st.ach.length}/${ACH.length}</h3><div class="small muted" style="margin-bottom:12px">Cada logro despierta una máscara guardiana y te da 25 monedas.</div>
    <div class="meds">${ACH.map((a,i)=>`<div class="med ${st.ach.includes(a.id)?'':'off'}">${achMask(i,34)}<div style="min-width:0"><b>${a.n}</b><span>${a.d}</span></div></div>`).join('')}</div></div>`}
  return `<div class="box" style="margin-top:24px"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">TU TESORO</h3><div class="disp" style="font-size:26px;margin-top:8px;display:flex;gap:10px;align-items:center">${coin(28)}${num(st.coins)}</div></div>
   <div class="small muted" style="text-align:right">XP total ${num(st.xp)}<br>Canjeado ${num(st.spent)}</div></div></div>
   <div class="seg">${segs.map(([k,l])=>`<button data-seg="${k}" aria-pressed="${CHEST===k}">${l}</button>`).join('')}</div>
   <div class="stack" style="margin-top:18px">${body}</div>`}
function bindChest(){document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{SFX.tap();CHEST=b.dataset.seg;render()});
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const r=S.rewards.find(x=>x.id===b.dataset.buy);if(!r||calc().coins<r.cost)return;
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='¿SEGURA?';SFX.tap();return}
    S.spent.push({id:r.id,name:r.name,cost:r.cost,date:today()});save();SFX.buy();confetti(70);
    modal(`<div class="center">${itemSVG(r.icon,76)}<h2>¡PREMIO DESBLOQUEADO!</h2><div><b>${esc(r.name)}</b></div><div class="small muted">Te lo ganaste moviéndote. Disfrútalo sin culpa.</div></div>`,[{t:'¡A DISFRUTAR!',c:'gold',fn:render}])});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent='¿?';return}S.rewards=S.rewards.filter(x=>x.id!==b.dataset.rm);save();render()});
  document.querySelectorAll('[data-idea]').forEach(b=>b.onclick=()=>{SFX.tap();$('#r-name').value=b.dataset.idea;$('#r-cost').value=b.dataset.cost});
  const add=$('#r-add');add&&(add.onclick=()=>{const n=$('#r-name').value.trim(),c=parseInt($('#r-cost').value,10);
    if(!n){toast('Escribe el nombre del premio');return}if(!(c>=10)){toast('Ponle un precio de 10 monedas o más');return}
    S.rewards.push({id:'r'+Date.now(),name:n,cost:c,icon:ITEMS[Math.floor(Math.random()*ITEMS.length)].id});save();SFX.coin();toast('Premio agregado');render()})}

/* ============ DIARIO ============ */
function logView(st){const t=today();const days=[...Array(14)].map((_,i)=>addDays(t,i-13));const ds=Object.keys(S.days).filter(d=>hasAny(S.days[d])).sort().reverse();
  const backs=ds.map(d=>S.days[d].back).filter(Boolean);const last7=backs.slice(0,7),prev7=backs.slice(7,14);const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length):null;
  const a1=avg(last7),a0=avg(prev7);
  const trend=a1==null?'Aún sin datos':a0==null?`Promedio ${a1.toFixed(1)} de 5`:a1<a0?`Bajó de ${a0.toFixed(1)} a ${a1.toFixed(1)}. ¡Va mejorando!`:a1>a0?`Subió de ${a0.toFixed(1)} a ${a1.toFixed(1)}. Ve con calma.`:`Estable en ${a1.toFixed(1)}`;
  const tl=e=>[isTrain(e)?TRAIN_LBL[e.train]+(e.trainMin?` (${e.trainMin} min)`:''):e.train==='descanso'?'Descanso':null,e.walkMin?`Caminó ${e.walkMin} min`:null,e.steps?`${num(e.steps)} pasos`:null,e.mood?`Ánimo ${e.mood}/5`:null,e.back?`Espalda ${e.back}/5`:null].filter(Boolean).join(' · ');
  return `<div class="kpis"><div class="kpi"><b>${st.days}</b><span>días registrados</span></div><div class="kpi"><b>${num(st.walk)}</b><span>minutos caminando</span></div>
   <div class="kpi"><b>${st.ses}</b><span>entrenamientos</span></div><div class="kpi"><b>${st.best}</b><span>mejor racha (días)</span></div></div>
  <div class="stack" style="margin-top:18px">
  <div class="box"><h3>ÚLTIMOS 14 DÍAS</h3>
   <div class="chart" aria-label="Minutos caminando por día"><div class="gl" style="bottom:50%"><span>30</span></div><div class="gl" style="bottom:100%"><span>60</span></div>
    ${days.map(d=>{const w=(S.days[d]||{}).walkMin||0;return `<i style="height:${Math.min(w,60)/60*100}%" title="${fmt(d)}: ${w} min"></i>`}).join('')}</div>
   <div class="painrow">${days.map(d=>{const b=(S.days[d]||{}).back;return `<i style="background:${b?PAIN[b]:'var(--panel2)'}" title="Espalda ${b||'-'}"></i>`}).join('')}</div>
   <div class="dayrow">${days.map(d=>`<span>${DIA[parse(d).getDay()][0].toUpperCase()}</span>`).join('')}</div>
   <div class="legend"><span><i style="background:var(--green);border-radius:2px"></i>Minutos caminando (tope 60)</span><span><i style="background:${PAIN[1]}"></i><i style="background:${PAIN[5]}"></i>Molestia de espalda 1 a 5</span></div>
   <div class="note">Espalda, últimos 7 registros: ${trend}</div></div>
  <div class="box"><h3>MI DIARIO</h3>${ds.length?ds.map(d=>{const e=S.days[d];return `<div class="entry"><div style="min-width:0"><div class="d">${fmt(d).toUpperCase()}</div><div class="t">${esc(tl(e))||'Registro'}</div>${e.note?`<div class="n">"${esc(e.note)}"</div>`:''}</div>
     <div><div class="x">+${(st.per[d]||{}).total||0} XP</div><button class="btn sm ghost" data-edit="${d}" style="margin-top:8px">EDITAR</button></div></div>`}).join(''):'<div class="muted">Todavía no hay días. Toca REGISTRAR para empezar tu aventura.</div>'}</div></div>`}
function bindLog(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{SFX.tap();go('add',{date:b.dataset.edit})})}

/* ============ AJUSTES ============ */
function settings(){SFX.tap();modal(`<h2>AJUSTES</h2>
  <label class="f" for="s-name" style="margin-top:0">NOMBRE DE LA JUGADORA</label><input type="text" id="s-name" maxlength="20" value="${esc(S.name)}">
  <label class="f">NOMBRES DE TU EQUIPO</label>
  ${PETS.map(p=>`<div class="row" style="margin-top:8px">${petArt(p,48)}<input type="text" data-pn="${p.id}" id="pn-${p.id}" maxlength="24" value="${esc(petName(p))}" aria-label="${esc(p.desc)}"></div>`).join('')}
  <label class="f" for="s-start">INICIO DEL PROGRAMA (DEFINE LAS SEMANAS DE JEFES)</label><input type="date" id="s-start" value="${S.start}">
  <div class="row" style="margin-top:14px;justify-content:space-between"><span>Sonidos de videojuego</span><button class="btn sm ${S.sound?'green':'ghost'}" id="s-snd">${S.sound?'ACTIVADOS':'APAGADOS'}</button></div>
  <label class="f">RESPALDO</label><div class="small muted">Copia tu respaldo y guárdalo en tus notas. Para recuperarlo, pégalo abajo.</div>
  <div class="row" style="margin-top:8px"><button class="btn sm ghost" id="s-copy">COPIAR RESPALDO</button><button class="btn sm ghost" id="s-imp">RESTAURAR</button></div>
  <textarea id="s-txt" placeholder="Pega aquí tu respaldo para restaurar" style="margin-top:8px;min-height:60px"></textarea>
  <button class="btn sm ghost" id="s-reset" style="margin-top:14px">BORRAR TODO Y EMPEZAR DE CERO</button>`,
  [{t:'GUARDAR',c:'gold'}],ov=>{
   const q=s=>ov.querySelector(s);
   ov.querySelector('[data-i="0"]').addEventListener('click',()=>{S.name=q('#s-name').value.trim()||'Paola';const sd=q('#s-start').value;if(sd)S.start=sd;
     S.petNames=S.petNames||{};ov.querySelectorAll('[data-pn]').forEach(i=>{const v=i.value.trim();if(v)S.petNames[i.dataset.pn]=v});save();render()});
   q('#s-snd').onclick=()=>{S.sound=!S.sound;save();q('#s-snd').textContent=S.sound?'ACTIVADOS':'APAGADOS';q('#s-snd').className='btn sm '+(S.sound?'green':'ghost');SFX.coin()};
   q('#s-copy').onclick=()=>{const txt=JSON.stringify(S);try{navigator.clipboard.writeText(txt).then(()=>toast('Respaldo copiado'),()=>{q('#s-txt').value=txt;q('#s-txt').select();toast('Cópialo de la caja de abajo')})}catch(e){q('#s-txt').value=txt;q('#s-txt').select()}};
   q('#s-imp').onclick=()=>{try{const d=JSON.parse(q('#s-txt').value);if(!d.days)throw 0;S=Object.assign(fresh(),d);save();toast('Respaldo restaurado');render()}catch(e){toast('Ese texto no es un respaldo válido')}};
   q('#s-reset').onclick=e=>{const b=e.target;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='¿SEGURA? SE BORRA TODO. TOCA OTRA VEZ';return}S=fresh();save();ov.remove();QUEUE.shift();VIEW='map';render();toast('Partida nueva')}})}

load();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>

</body>
